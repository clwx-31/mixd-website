<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-bg-title hero-bg-desc">
  <title id="hero-bg-title">MIXD abstract split-colour hero background</title>
  <desc id="hero-bg-desc">A dark field with violet, pink and orange split-colour forms around a clear central area.</desc>
  <defs>
    <linearGradient id="hero-bg-grad-1" x1="0" y1="0" x2="1600" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111118"/>
      <stop offset="0.48" stop-color="#0B0B0F"/>
      <stop offset="1" stop-color="#160D1D"/>
    </linearGradient>
    <linearGradient id="hero-bg-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.5" stop-color="#6C3CF4"/>
      <stop offset="0.5" stop-color="#FF2D78"/>
    </linearGradient>
    <linearGradient id="hero-bg-grad-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.5" stop-color="#FF2D78"/>
      <stop offset="0.5" stop-color="#FF9F0A"/>
    </linearGradient>
    <radialGradient id="hero-bg-glow-1" cx="0" cy="0" r="1" gradientTransform="translate(800 410) scale(600 370)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B0F" stop-opacity="0"/>
      <stop offset="0.64" stop-color="#0B0B0F" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0B0B0F" stop-opacity="0.76"/>
    </radialGradient>
    <filter id="hero-bg-blur-1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="hero-bg-shadow-1" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="820" fill="url(#hero-bg-grad-1)"/>

  <circle cx="86" cy="118" r="250" fill="#6C3CF4" opacity="0.24" filter="url(#hero-bg-blur-1)"/>
  <circle cx="1518" cy="712" r="280" fill="#FF2D78" opacity="0.2" filter="url(#hero-bg-blur-1)"/>
  <circle cx="1375" cy="42" r="190" fill="#FF9F0A" opacity="0.1" filter="url(#hero-bg-blur-1)"/>

  <g opacity="0.9" filter="url(#hero-bg-shadow-1)" transform="translate(-30 80) rotate(-16 210 220)">
    <rect x="18" y="112" width="390" height="214" rx="107" fill="url(#hero-bg-grad-2)"/>
    <path d="M213 112v214" stroke="#FFFFFF" stroke-opacity="0.2"/>
  </g>

  <g opacity="0.82" filter="url(#hero-bg-shadow-1)" transform="translate(1276 450) rotate(19 185 122)">
    <rect x="0" y="18" width="370" height="208" rx="104" fill="url(#hero-bg-grad-3)"/>
    <path d="M185 18v208" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>

  <g opacity="0.28" transform="translate(568 -32) rotate(11 116 57)">
    <rect width="232" height="114" rx="57" fill="url(#hero-bg-grad-2)"/>
    <path d="M116 0v114" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>
  <g opacity="0.24" transform="translate(824 745) rotate(-12 122 60)">
    <rect width="244" height="120" rx="60" fill="url(#hero-bg-grad-3)"/>
    <path d="M122 0v120" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M-120 700C105 518 265 551 407 709" stroke="#6C3CF4" stroke-width="3"/>
    <path d="M1190 122c150-121 334-106 505 40" stroke="#FF2D78" stroke-width="3"/>
  </g>

  <rect width="1600" height="820" fill="url(#hero-bg-glow-1)"/>
  <g fill="#FFFFFF">
    <circle cx="344" cy="130" r="3" opacity="0.35"/>
    <circle cx="1252" cy="190" r="2" opacity="0.3"/>
    <circle cx="1452" cy="356" r="3" opacity="0.22"/>
    <circle cx="220" cy="624" r="2" opacity="0.24"/>
  </g>
</svg>
