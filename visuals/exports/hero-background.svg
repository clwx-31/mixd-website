<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="hero-bg-title hero-bg-desc">
  <title id="hero-bg-title">Minimal black and purple MIXD hero background</title>
  <desc id="hero-bg-desc">A black field with a restrained violet glow and fine orbital lines.</desc>
  <defs>
    <radialGradient id="hero-purple-glow-1" cx="0" cy="0" r="1" gradientTransform="translate(800 80) scale(720 540)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B21B6" stop-opacity="0.34"/>
      <stop offset="0.46" stop-color="#35136C" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-purple-line-1" x1="200" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="820" fill="#000000"/>
  <rect width="1600" height="820" fill="url(#hero-purple-glow-1)"/>
  <g fill="none" stroke="#8B5CF6">
    <ellipse cx="800" cy="300" rx="670" ry="450" opacity="0.12"/>
    <ellipse cx="800" cy="300" rx="820" ry="560" opacity="0.07"/>
  </g>
  <path d="M190 738H1410" stroke="url(#hero-purple-line-1)"/>
  <g fill="#C4B5FD">
    <circle cx="130" cy="202" r="2.5" opacity="0.42"/>
    <circle cx="1468" cy="598" r="2" opacity="0.34"/>
  </g>
</svg>
